name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q VirtualGSI.zip
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx3g\n' > VirtualGSI/gradle.properties
          mkdir -p VirtualGSI/app/src/main/jniLibs/arm64-v8a
          cp jniLibs/*.so VirtualGSI/app/src/main/jniLibs/arm64-v8a/ || true
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p VirtualGSI :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualGSI-apk
          path: VirtualGSI/app/build/outputs/apk/debug/app-debug.apk
